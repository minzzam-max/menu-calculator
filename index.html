<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#173b32">
<title>분식집 간편 계산기</title>
<style>
:root{--green:#176b50;--dark:#173b32;--bg:#f4f6f3;--line:#e3e9e4;--muted:#718078;--red:#c44d42}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1d2923;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
button{font:inherit;cursor:pointer;border:0}header{background:var(--dark);color:white;padding:11px 15px;position:sticky;top:0;z-index:4}
.head,main,.total-inner{max-width:760px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:17px;margin:0 0 2px}.sub{font-size:11px;color:#c5d8ce}.header-btn{background:#ffffff1c;border:1px solid #ffffff35;color:white;border-radius:10px;padding:8px 11px;font-size:13px}
main{padding:10px 13px 24px}.topline{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 7px}h2{font-size:15px;margin:0}
.hint{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:1px 1px 8px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:7px 13px;border-radius:999px;background:#e8eee9;color:#4c5b52;font-size:13px;font-weight:650}
.tab.active{background:var(--green);color:white}
.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.menu-card{position:relative;min-height:66px;text-align:left;background:white;border:1px solid var(--line);border-radius:13px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;box-shadow:0 2px 6px #15291c08;transition:transform .1s}
.menu-card:active{transform:scale(.975)}.menu-card.selected{border:2px solid var(--green);padding:9px 11px;background:#f5faf6}
.menu-name{font-size:15px;font-weight:800;padding-right:30px}
.menu-bottom{display:flex;align-items:baseline;justify-content:space-between;gap:6px;flex-wrap:wrap}
.menu-price{font-size:14px;color:var(--green);font-weight:800}
.menu-note{font-size:10px;color:var(--muted)}
.count{position:absolute;right:8px;top:8px;min-width:26px;height:26px;padding:0 6px;border-radius:20px;background:#e9efeb;color:#526158;display:grid;place-items:center;font-size:12px;font-weight:800}
.selected .count{background:var(--green);color:white}
.order-panel{margin-top:12px;background:white;border:1px solid var(--line);border-radius:14px;padding:10px 13px}
.order-head{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.order-total{margin-left:auto;font-size:22px;font-weight:900;color:var(--green)}
.text-btn{background:none;color:var(--red);font-size:12px;padding:5px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:14px 5px}
.order-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #edf0ed}
.order-row:last-child{border-bottom:0}
.order-info{flex:1;min-width:0}.order-name{font-size:14px;font-weight:750}.order-detail{font-size:11px;color:var(--muted);margin-top:2px}
.qty{display:flex;align-items:center;gap:7px}.qty button{width:28px;height:28px;border-radius:9px;background:#edf3ef;color:var(--dark);font-size:18px;line-height:1}
.qty span{min-width:15px;text-align:center;font-size:14px;font-weight:750}.line-total{font-size:13px;font-weight:800;min-width:70px;text-align:right}
.remove{background:#fff0ee;color:var(--red);width:26px;height:26px;border-radius:8px;font-size:15px}
.totalbar{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);padding:9px 15px calc(9px + env(safe-area-inset-bottom));z-index:5;box-shadow:0 -5px 18px #14251a0d}
.total-inner{display:flex;align-items:center;justify-content:space-between;gap:10px}.total-label{font-size:12px;color:var(--muted)}.total-value{font-size:24px;font-weight:900;color:var(--green);margin-top:1px}
.reset{background:#edf1ed;color:#33463b;padding:11px 14px;border-radius:11px;font-weight:750}
.modal-back{display:none;position:fixed;inset:0;background:#0b1712a8;z-index:10;align-items:flex-end;justify-content:center}.modal-back.show{display:flex}
.modal{background:white;width:100%;max-width:600px;max-height:91dvh;overflow:auto;border-radius:20px 20px 0 0;padding:19px 16px calc(22px + env(safe-area-inset-bottom))}
.modal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.modal h2{font-size:18px}.close{background:#edf1ed;border-radius:9px;padding:8px 11px}
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:12px;color:#53635a;font-weight:750}
input,select{width:100%;padding:12px;border:1px solid #dce4dd;border-radius:10px;font:inherit;font-size:15px;background:white}
input:focus,select:focus{outline:1px solid var(--green);border-color:var(--green)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.primary{background:var(--green);color:white;padding:13px;border-radius:11px;font-weight:800;width:100%;margin-top:8px}
.admin-row{border:1px solid var(--line);border-radius:12px;padding:11px;margin:8px 0;display:flex;align-items:center;gap:8px}
.admin-info{flex:1;min-width:0}.admin-info strong{font-size:14px}.admin-info small{display:block;color:var(--muted);margin-top:3px}
.admin-actions{display:flex;gap:5px}.admin-actions button{background:#edf2ee;padding:8px 9px;border-radius:8px;font-size:12px}.admin-actions .del{background:#fff0ee;color:var(--red)}
.rule{background:#f2f6f2;border-radius:10px;padding:11px;font-size:12px;color:#506158;line-height:1.55;margin:10px 0}
.menu-item{display:flex;gap:5px;min-width:0}
.menu-item .menu-card{flex:1;min-width:0}
.menu-minus{width:32px;flex:none;border-radius:13px;background:#fff0ee;color:var(--red);border:1px solid #f4d6d2;font-size:20px;font-weight:700;line-height:1}
.menu-minus:active:not(:disabled){transform:scale(.94)}
.menu-minus:disabled{opacity:.35;cursor:default}
.hands{display:inline-flex;margin-top:5px;background:#ffffff1c;border:1px solid #ffffff30;border-radius:9px;overflow:hidden}
.hands button{background:none;color:#c5d8ce;font-size:12px;font-weight:650;padding:6px 11px}
.hands button.active{background:white;color:var(--dark)}
/* 왼손 버전: 버튼을 왼쪽으로 */
body.hand-left .head,body.hand-left .total-inner,body.hand-left .modal-top{flex-direction:row-reverse}
body.hand-left .head>div:first-child,body.hand-left .total-inner>div:first-child{text-align:right}
body.hand-left .order-row .qty{order:1}
body.hand-left .order-row .remove{order:2}
body.hand-left .order-row .order-info{order:3}
body.hand-left .order-row .line-total{order:4}
/* 오른손 버전: 버튼을 오른쪽으로 */
body.hand-right .order-row .order-info{order:1}
body.hand-right .order-row .line-total{order:2}
body.hand-right .order-row .remove{order:3}
body.hand-right .order-row .qty{order:4}
@media(max-width:579px){
 body.hand-left .menu-grid,body.hand-right .menu-grid{width:78%}
 body.hand-right .menu-grid{margin-left:auto}
 body.hand-left .menu-minus,body.hand-right .menu-minus{width:28px}
 body.hand-left .menu-name,body.hand-right .menu-name{font-size:14px;padding-right:22px}
 body.hand-left .count,body.hand-right .count{min-width:22px;height:22px;font-size:11px;right:7px;top:7px}
}
@media(min-width:580px){.menu-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.modal-back{align-items:center}.modal{border-radius:20px}}
</style>
</head>
<body>
<header><div class="head"><div><h1>분식집 간편 계산기</h1><div class="hands" id="handSwitch" role="group" aria-label="사용 손 선택"><button data-hand="left">왼손</button><button data-hand="normal">기본</button><button data-hand="right">오른손</button></div></div><button class="header-btn" id="settingsOpen">⚙ 메뉴 설정</button></div></header>
<main>
 <div class="menu-grid" id="menuGrid"></div>
 <section class="order-panel">
  <div class="order-head"><h2>계산 내역</h2><button class="text-btn" id="clearOrder">전체 비우기</button><div class="order-total" id="grandTotal">0원</div></div>
  <div id="orderList" class="empty">메뉴를 선택하면 계산 내역이 표시됩니다.</div>
 </section>
</main>

<div class="modal-back" id="settingsModal"><div class="modal">
 <div class="modal-top"><h2>메뉴 설정</h2><button class="close" id="settingsClose">닫기 ✕</button></div>
 <div class="rule">메뉴 이름·가격·카테고리와 묶음 가격을 추가하거나 수정할 수 있습니다. 변경 사항은 이 브라우저에 저장됩니다.</div>
 <div id="adminList"></div><button class="primary" id="addNew">＋ 메뉴 추가</button>
</div></div>
<div class="modal-back" id="editModal"><div class="modal">
 <div class="modal-top"><h2 id="editTitle">메뉴 추가</h2><button class="close" id="editClose">닫기 ✕</button></div>
 <div class="field"><label for="menuName">메뉴 이름</label><input id="menuName" placeholder="예: 김밥"></div>
 <div class="form-grid">
  <div class="field"><label for="menuPrice">1개 가격 (원)</label><input id="menuPrice" type="number" min="0" inputmode="numeric" placeholder="예: 3000"></div>
  <div class="field"><label for="menuCategory">카테고리</label><select id="menuCategory"><option>꼬치류</option><option>분식류</option><option>기타</option></select></div>
 </div>
 <div class="form-grid">
  <div class="field"><label for="bundleQty">묶음 수량 (없으면 0)</label><input id="bundleQty" type="number" min="0" inputmode="numeric" placeholder="예: 3"></div>
  <div class="field"><label for="bundlePrice">묶음 가격 (원)</label><input id="bundlePrice" type="number" min="0" inputmode="numeric" placeholder="예: 2000"></div>
 </div>
 <div class="rule">예: 어묵은 1개 700원, 묶음 수량 3개, 묶음 가격 2,000원으로 설정합니다. 4개는 2,700원, 6개는 4,000원으로 계산됩니다.</div>
 <button class="primary" id="saveMenu">저장하기</button>
</div></div>
<script>
const defaults=[
{id:"fishcake",name:"어묵",price:700,category:"꼬치류",bundleQty:3,bundlePrice:2000},
{id:"heart",name:"염통 꼬치",price:700,category:"꼬치류",bundleQty:3,bundlePrice:2000},
{id:"ricecake",name:"떡꼬치",price:500,category:"꼬치류",bundleQty:0,bundlePrice:0},
{id:"chicken",name:"닭꼬치",price:2500,category:"꼬치류",bundleQty:0,bundlePrice:0},
{id:"ham",name:"햄",price:2500,category:"꼬치류",bundleQty:0,bundlePrice:0},
{id:"fishbread",name:"붕어빵",price:700,category:"분식류",bundleQty:3,bundlePrice:2000}
];
const $=id=>document.getElementById(id);
function readMenus(){
 try{
  const saved=localStorage.getItem("snack_calc_menus");
  if(!saved)return defaults;
  const parsed=JSON.parse(saved);
  // 기존 사용자의 메뉴 설정은 유지하고, 새 기본 메뉴만 없는 경우 추가
  const fishbread=defaults.find(m=>m.id==="fishbread");
  if(!parsed.some(m=>m.id==="fishbread"))parsed.push(fishbread);
  return parsed;
 }catch(e){return defaults}
}
let menus=readMenus(),order={},category="전체",editingId=null;
const money=n=>Math.round(n).toLocaleString("ko-KR")+"원";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){localStorage.setItem("snack_calc_menus",JSON.stringify(menus))}
function calc(m,q){if(m.bundleQty>0&&m.bundlePrice>0)return Math.floor(q/m.bundleQty)*m.bundlePrice+(q%m.bundleQty)*m.price;return q*m.price}
function render(){
 const grid=$("menuGrid");grid.innerHTML="";
 menus.filter(m=>category==="전체"||(m.category||"기타")===category).forEach(m=>{
  const q=order[m.id]||0,b=document.createElement("button");b.className="menu-card"+(q?" selected":"");
  b.innerHTML=`<span class="count">${q||"+"}</span><span class="menu-name">${esc(m.name)}</span><span class="menu-bottom"><span class="menu-price">${money(m.price)}</span>${m.bundleQty?`<span class="menu-note">${m.bundleQty}개 ${money(m.bundlePrice)}</span>`:""}</span>`;
  b.onclick=()=>{order[m.id]=(order[m.id]||0)+1;render()};
  const wrap=document.createElement("div");wrap.className="menu-item";
  const mb=document.createElement("button");mb.className="menu-minus";mb.textContent="−";mb.disabled=!q;mb.setAttribute("aria-label",m.name+" 1개 빼기");
  mb.onclick=()=>{order[m.id]=(order[m.id]||0)-1;if(order[m.id]<=0)delete order[m.id];render()};
  wrap.append(b,mb);grid.appendChild(wrap);
 });renderOrder();
}
function renderOrder(){
 const box=$("orderList");box.innerHTML="";let total=0,has=false;
 menus.forEach(m=>{const q=order[m.id]||0;if(!q)return;has=true;const sum=calc(m,q);total+=sum;
  const row=document.createElement("div");row.className="order-row";
  const detail=m.bundleQty?`${q}개${q>=m.bundleQty?` · ${m.bundleQty}개 묶음 적용`:""}`:`${q}개 × ${money(m.price)}`;
  row.innerHTML=`<div class="order-info"><div class="order-name">${esc(m.name)}</div><div class="order-detail">${detail}</div></div><div class="qty"><button class="minus">−</button><span>${q}</span><button class="plus">＋</button></div><div class="line-total">${money(sum)}</div><button class="remove" aria-label="항목 삭제">×</button>`;
  row.querySelector(".minus").onclick=()=>{order[m.id]--;if(order[m.id]<=0)delete order[m.id];render()};row.querySelector(".plus").onclick=()=>{order[m.id]++;render()};row.querySelector(".remove").onclick=()=>{delete order[m.id];render()};box.appendChild(row);
 });
 if(!has){box.className="empty";box.textContent="메뉴를 선택하면 계산 내역이 표시됩니다."}else box.className="";
 $("grandTotal").textContent=money(total);
}
function openSettings(){renderAdmin();$("settingsModal").classList.add("show")}
function renderAdmin(){
 const box=$("adminList");box.innerHTML="";
 menus.forEach(m=>{const row=document.createElement("div");row.className="admin-row";row.innerHTML=`<div class="admin-info"><strong>${esc(m.name)}</strong><small>${esc(m.category||"기타")} · ${money(m.price)}${m.bundleQty?` · ${m.bundleQty}개 ${money(m.bundlePrice)}`:""}</small></div><div class="admin-actions"><button class="edit">수정</button><button class="del">삭제</button></div>`;
 row.querySelector(".edit").onclick=()=>openEditor(m.id);row.querySelector(".del").onclick=()=>{if(confirm(`${m.name} 메뉴를 삭제할까요?`)){menus=menus.filter(x=>x.id!==m.id);delete order[m.id];save();render();renderAdmin()}};box.appendChild(row)});
}
function openEditor(id=null){
 editingId=id;const m=menus.find(x=>x.id===id);$("editTitle").textContent=m?"메뉴 수정":"메뉴 추가";
 $("menuName").value=m?.name||"";$("menuPrice").value=m?.price??"";$("menuCategory").value=m?.category||"꼬치류";$("bundleQty").value=m?.bundleQty||"";$("bundlePrice").value=m?.bundlePrice||"";$("editModal").classList.add("show");
}
$("settingsOpen").onclick=openSettings;$("settingsClose").onclick=()=>$("settingsModal").classList.remove("show");$("addNew").onclick=()=>openEditor();$("editClose").onclick=()=>$("editModal").classList.remove("show");
$("saveMenu").onclick=()=>{
 const name=$("menuName").value.trim(),price=Number($("menuPrice").value),cat=$("menuCategory").value,bq=Number($("bundleQty").value)||0,bp=Number($("bundlePrice").value)||0;
 if(!name||$("menuPrice").value===""||!Number.isFinite(price)||price<0){alert("메뉴 이름과 올바른 가격을 입력해주세요.");return}
 if((bq>0&&bp<=0)||(bq===0&&bp>0)){alert("묶음 수량과 묶음 가격을 함께 입력하거나 둘 다 비워주세요.");return}
 if(editingId){Object.assign(menus.find(x=>x.id===editingId),{name,price,category:cat,bundleQty:bq,bundlePrice:bp})}
 else menus.push({id:"m"+Date.now(),name,price,category:cat,bundleQty:bq,bundlePrice:bp});
 save();render();renderAdmin();$("editModal").classList.remove("show");
};
$("clearOrder").onclick=()=>{if(Object.keys(order).length&&confirm("현재 계산 내역을 모두 비울까요?")){order={};render()}};
let hand="normal";
try{hand=localStorage.getItem("snack_calc_hand")||"normal"}catch(e){}
if(!["left","right","normal"].includes(hand))hand="normal";
function setHand(h){
 hand=h;document.body.classList.remove("hand-left","hand-right");
 if(h!=="normal")document.body.classList.add("hand-"+h);
 document.querySelectorAll("#handSwitch button").forEach(b=>{const on=b.dataset.hand===h;b.classList.toggle("active",on);b.setAttribute("aria-pressed",on)});
 try{localStorage.setItem("snack_calc_hand",h)}catch(e){}
}
document.querySelectorAll("#handSwitch button").forEach(b=>b.onclick=()=>setHand(b.dataset.hand));
setHand(hand);
render();
</script>
</body></html>
